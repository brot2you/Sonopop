<script>
'use strict';
const DB='soundpop-v1', STORE='state', KEY='main';
const colors=['#ff88ad','#ffbc64','#ffd879','#9f8cf9','#91c8ff','#7edbd1','#b5e981','#d4a8fa'];
const id=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const starter=()=>({version:1,active:'',editing:false,simultaneous:false,columns:6,limit:12,categories:[{id:id(),name:'Mes sons',pads:[...['Cloche|🔔','Applaudissements|👏','Batterie|🥁','Public|🙌','Score !|⚡','Victoire|🏆','Vague|🌊','Vent|💨','Oiseau|🐦','Pluie|🌧️','Feu|🔥','Ville|🏙️'].map((s,i)=>({id:id(),name:s.split('|')[0],emoji:s.split('|')[1],color:colors[i],image:'',audio:'',favorite:false}))]}]});
let state=starter(),db=null,activeAudio=new Set(),saveTimer=null,showFavorites=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),2800)}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDb(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function writeDb(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(state,KEY);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>writeDb().catch(e=>toast('Erreur de sauvegarde : '+e.message)),180)}
function category(){return state.categories.find(c=>c.id===state.active)||state.categories[0]}
function stopAll(){for(const a of activeAudio){a.pause();a.currentTime=0}activeAudio.clear();document.querySelectorAll('.pad.playing').forEach(p=>p.classList.remove('playing'))}
function play(p,el){if(!p.audio){toast('Ajoute un MP3 à ce bouton en mode édition');return}if(!state.simultaneous)stopAll();let a=new Audio(p.audio);a.volume=(state.volume??80)/100;activeAudio.add(a);el.classList.add('playing');const done=()=>{activeAudio.delete(a);if(![...activeAudio].some(x=>x._padId===p.id))el.classList.remove('playing')};a._padId=p.id;a.onended=done;a.onerror=()=>{done();toast('Impossible de lire ce fichier audio')};a.play().catch(()=>{done();toast('Lecture audio bloquée ou fichier invalide')})}
function render(){let c=category();state.active=c.id;$('#catTitle').textContent=showFavorites?'★ Mes favoris':c.name;$('#catCount').textContent=(showFavorites?state.categories.flatMap(x=>x.pads).filter(p=>p.favorite).length:c.pads.length)+' bouton(s)';$('#cols').value=state.columns;$('#limit').value=state.limit;$('#mix').checked=state.simultaneous;$('#modeBtn').textContent=state.editing?'✓ Terminer l’édition':'✏️ Mode édition';$('#addPadBtn').classList.toggle('hidden',!state.editing);
$('#tabs').innerHTML=state.categories.map(x=>`<button class="tab ${x.id===c.id?'active':''}" data-tab="${esc(x.id)}">${esc(x.name)}${state.editing?' ⚙️':''}</button>`).join('')+(state.editing?'<button class="tab" id="addCat">＋ Catégorie</button>':'');
let pads=(showFavorites?state.categories.flatMap(x=>x.pads).filter(p=>p.favorite):c.pads).slice(0,state.limit),g=$('#grid');g.style.setProperty('--cols',state.columns);
g.innerHTML=pads.length?pads.map(p=>`<button class="pad" style="--pad:${colors.includes(p.color)?p.color:colors[0]};background-image:url(assets/${`pad-${String(((colors.indexOf(p.color)+8)%8)+1).padStart(2,"0")}`}.webp)" data-pad="${esc(p.id)}" aria-label="Jouer ${esc(p.name)}"><span class="art">${p.image?`<img alt="" src="${esc(p.image)}">`:['Cloche','Applaudissements','Batterie'].includes(p.name)?`<img alt="" src="assets/icon-${({Cloche:'bell',Applaudissements:'clap',Batterie:'drum'})[p.name]}.webp">`:esc(p.emoji||'🔊')}</span><strong>${esc(p.name)}</strong>${state.editing?'<span class="edit" aria-hidden="true">✏️</span>':''}<span class="fav-marker">${p.favorite?"★":""}</span>${!p.audio?'<span class="missing">MP3 à ajouter</span>':''}</button>`).join(''):'<div class="empty">🎶<h2>Aucun son pour le moment</h2><p>Passe en mode édition pour créer ton premier bouton.</p></div>';
}
$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){if(state.editing)editCategory(b.dataset.tab);else{stopAll();state.active=b.dataset.tab;showFavorites=false;save();render()}}else if(e.target.closest('#addCat'))editCategory(null)};
$('#grid').onclick=e=>{let b=e.target.closest('[data-pad]');if(!b)return;let p=state.categories.flatMap(x=>x.pads).find(x=>x.id===b.dataset.pad);if(state.editing)editPad(p.id);else play(p,b)};
$('#modeBtn').onclick=()=>{state.editing=!state.editing;showFavorites=false;save();render()};
$('#addPadBtn').onclick=()=>editPad(null);
$('#stopBtn').onclick=stopAll;$('#settingsBtn').onclick=()=>{modal('<h2>Réglages ⚙️</h2><label class="field">Volume général <input id="volSetting" type="range" min="0" max="100" value="'+(state.volume??80)+'"></label><label class="field">Sons simultanés <input id="mixSetting" type="checkbox" '+(state.simultaneous?'checked':'')+'></label><div class="modal-actions"><button class="btn primary" id="settingsSave">Enregistrer</button></div>');$('#settingsSave').onclick=()=>{state.volume=Number($('#volSetting').value);state.simultaneous=$('#mixSetting').checked;save();closeModal();render()}};$('#mix').onchange=e=>{state.simultaneous=e.target.checked;save()};
$('#cols').onchange=e=>{state.columns=Number(e.target.value);save();render()};
$('#limit').onchange=e=>{state.limit=Math.max(1,Math.min(100,Number(e.target.value)||12));save();render()};
$('#sideBoard').onclick=()=>{showFavorites=false;state.active=state.categories[0].id;render()};$('#sideEdit').onclick=()=>$('#modeBtn').click();$('#sideFavorites').onclick=()=>{showFavorites=!showFavorites;if(state.editing){state.editing=false;save()}render()};$('#sideCategories').onclick=()=>{if(!state.editing)$('#modeBtn').click();editCategory(null)};$('#sideHelp').onclick=()=>alert('Choisis un onglet puis clique sur un bouton pour jouer le son. En mode édition, clique sur les boutons pour personnaliser les MP3, images et catégories. Pense à exporter ta sauvegarde JSON.');$('#fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>toast('Plein écran indisponible'))};
function modal(content){$('#modalRoot').innerHTML='<div class="overlay"><section class="modal" role="dialog" aria-modal="true">'+content+'</section></div>';$('#modalRoot .overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function editCategory(catId){let old=state.categories.find(c=>c.id===catId),name=old?.name||'';modal(`<h2>${old?'Modifier la catégorie':'Nouvelle catégorie'} 📁</h2><label class="field">Nom de la catégorie<input id="catName" maxlength="45" value="${esc(name)}" placeholder="Ex. Sons de classe"></label><div class="modal-actions">${old&&state.categories.length>1?'<button class="btn danger" id="deleteCat">Supprimer</button>':''}<button class="btn" id="cancel">Annuler</button><button class="btn primary" id="saveCat">Enregistrer</button></div>`);$('#cancel').onclick=closeModal;$('#saveCat').onclick=()=>{let n=$('#catName').value.trim();if(!n)return toast('Donne un nom à la catégorie');if(old)old.name=n;else{old={id:id(),name:n,pads:[]};state.categories.push(old)}state.active=old.id;save();closeModal();render()};if($('#deleteCat'))$('#deleteCat').onclick=()=>{if(!confirm('Supprimer cette catégorie et tous ses boutons ?'))return;stopAll();state.categories=state.categories.filter(c=>c.id!==catId);state.active=state.categories[0].id;save();closeModal();render()}};
const fileData=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(f)});
function editPad(padId){let c=category(),old=c.pads.find(p=>p.id===padId),draft=old?{...old}:{id:id(),name:'',emoji:'🔊',color:colors[0],image:'',audio:'',favorite:false};
modal(`<h2>${old?'Modifier le bouton':'Nouveau bouton'} 🎛️</h2><label class="field">Nom du bouton<input id="padName" maxlength="65" value="${esc(draft.name)}" placeholder="Ex. Victoire !"></label><label class="field">Emoji (si aucune illustration)<input id="padEmoji" maxlength="12" value="${esc(draft.emoji)}"></label><div class="field">Couleur<div class="colors">${colors.map(c=>`<button class="swatch ${c===draft.color?'selected':''}" style="background:${c}" data-color="${c}" aria-label="Couleur ${c}"></button>`).join('')}</div></div><label class="field">Illustration (PNG, JPG, WEBP, GIF)<input id="padImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><div class="muted" id="imageStatus">${draft.image?'Illustration enregistrée':'Aucune illustration'}</div><button class="btn" id="clearImage">Retirer l’illustration</button><label class="field">Son (MP3, WAV, OGG, M4A)<input id="padAudio" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a"></label><div class="muted" id="audioStatus">${draft.audio?'Son enregistré':'Aucun son'}</div><button class="btn" id="clearAudio">Retirer le son</button><label class="field">Favori<input type="checkbox" id="padFavorite" ${draft.favorite?"checked":""}></label><div class="modal-actions">${old?'<button class="btn danger" id="deletePad">Supprimer</button>':''}<button class="btn" id="cancel">Annuler</button><button class="btn primary" id="savePad">Enregistrer</button></div>`);
$('#cancel').onclick=closeModal;document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{draft.color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b))});
$('#padImage').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type))return toast('Format image non pris en charge');draft.image=await fileData(f);$('#imageStatus').textContent=f.name};
$('#padAudio').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|ogg|m4a)$/i.test(f.name))return toast('Fichier audio invalide');draft.audio=await fileData(f);$('#audioStatus').textContent=f.name};
$('#clearImage').onclick=()=>{draft.image='';$('#imageStatus').textContent='Aucune illustration'};$('#clearAudio').onclick=()=>{draft.audio='';$('#audioStatus').textContent='Aucun son'};
$('#savePad').onclick=()=>{draft.name=$('#padName').value.trim();draft.emoji=$('#padEmoji').value.trim()||'🔊';draft.favorite=$('#padFavorite').checked;draft.template=0;if(!draft.name)return toast('Donne un nom au bouton');if(old)Object.assign(old,draft);else c.pads.push(draft);save();closeModal();render();toast('Bouton enregistré !')};
if($('#deletePad'))$('#deletePad').onclick=()=>{if(!confirm('Supprimer ce bouton ?'))return;stopAll();c.pads=c.pads.filter(p=>p.id!==padId);save();closeModal();render()};
}
$('#exportBtn').onclick=()=>{let copy={...state,editing:false,exportedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(copy)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SONOPOP_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Sauvegarde exportée (sons et images inclus)')};
$('#importBtn').onclick=()=>$('#importFile').click();
function valid(s){return s&&s.version===1&&Array.isArray(s.categories)&&s.categories.length>0&&s.categories.length<=100&&s.categories.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.pads)&&c.pads.length<=1000&&c.pads.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&(!p.audio||typeof p.audio==='string'&&p.audio.startsWith('data:audio/'))&&(!p.image||typeof p.image==='string'&&p.image.startsWith('data:image/'))))}
$('#importFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let s=JSON.parse(await f.text());if(!valid(s))throw Error('Format SONOPOP non reconnu');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;stopAll();state={...starter(),...s,editing:false,columns:[2,3,4,5,6,8].includes(+s.columns)?+s.columns:4,limit:Math.max(1,Math.min(100,+s.limit||12)),simultaneous:!!s.simultaneous};if(!state.categories.some(c=>c.id===state.active))state.active=state.categories[0].id;await writeDb();render();toast('Sauvegarde importée avec succès')}catch(err){toast('Import impossible : '+err.message)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(async()=>{try{db=await openDb();let s=await readDb();if(valid(s))state={...state,...s,editing:false};else await writeDb()}catch(e){alert('Le stockage local est indisponible : les changements ne seront pas sauvegardés. '+e.message)}state.active=category().id;render()})();
</script></body></html>
