<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6558ed"><title>SONOPOP by BROT2YOU</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#25316c;background:radial-gradient(circle at 15% 10%,#fff3b2 0,transparent 26%),radial-gradient(circle at 85% 10%,#ffb8e9 0,transparent 32%),linear-gradient(140deg,#85dafa,#d2bcff 50%,#f6c9eb);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1350px;margin:auto;padding:20px}.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.logo{font-size:clamp(36px,6vw,78px);font-weight:1000;letter-spacing:-4px;line-height:1.05;color:#fff;text-shadow:0 5px #3425a0,0 9px #6951db,0 12px 17px #29238680;-webkit-text-stroke:2px #3a3eb3}.logo .so{color:#ffdb56}.logo .pop{color:#ff5abf}.by{font-weight:900;font-size:13px;color:#2b3488;letter-spacing:2px;text-align:center}.top-actions{display:flex;gap:9px}.top-actions button{background:linear-gradient(#ff87d3,#e72ea0);color:white;border:3px solid white;border-radius:22px;box-shadow:0 5px #a02d8d;padding:11px 15px;font-weight:900}.top-actions button:last-child{background:linear-gradient(#70e7ff,#3676ed);box-shadow:0 5px #335bb1}.wave{height:64px;border-radius:30px;background:repeating-linear-gradient(90deg,transparent 0 8px,#ffffff80 9px 15px,transparent 16px 25px);opacity:.5;mask-image:linear-gradient(transparent 0,#000 45%,transparent 100%)}.tabs{display:flex;gap:10px;overflow-x:auto;padding:10px 3px 19px}.tab{border:3px solid #fff;border-radius:25px;padding:13px 19px;color:white;font-weight:900;white-space:nowrap;background:linear-gradient(145deg,#ef71f7,#8441dc);box-shadow:0 5px #6554b1}.tab:nth-child(4n+1){background:linear-gradient(#ff73be,#ec248e)}.tab:nth-child(4n+2){background:linear-gradient(#52e9ff,#0a9ddd)}.tab:nth-child(4n+3){background:linear-gradient(#ad87ff,#7252dd)}.tab.active{outline:3px solid #ffdc60;outline-offset:2px}.board{background:#ffffff75;border:5px solid #fff;border-radius:35px;padding:23px;box-shadow:0 12px 30px #7566ba50;backdrop-filter:blur(8px)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.bar h2{margin:0;font-size:23px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools button,.tools select,.tools input{border:2px solid white;border-radius:15px;background:#fff;padding:9px 12px;color:#33347e;font-weight:800;box-shadow:0 3px #d4bff6}.tools input[type=number]{width:65px}.grid{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:18px}.pad{min-width:0;aspect-ratio:1.05;border:4px solid #fff;border-radius:27px;background:linear-gradient(155deg,#ffffff88 0,transparent 42%),linear-gradient(150deg,var(--c),var(--d));box-shadow:inset 0 3px 8px #fff9,inset 0 -7px 8px #0002,0 7px 0 #5448a977,0 11px 16px #4640a040;position:relative;color:white;text-shadow:0 2px 3px #38307590;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:9px;transition:.12s}.pad:active,.pad.playing{transform:translateY(5px);box-shadow:inset 0 3px 10px #fff9,0 2px 0 #5448a977}.pad .art{height:56%;width:78%;display:grid;place-items:center;font-size:clamp(28px,5vw,66px);filter:drop-shadow(0 4px 3px #0003)}.pad img{max-width:100%;max-height:100%;object-fit:contain}.pad strong{font-size:clamp(11px,1.5vw,17px);overflow-wrap:anywhere}.star{position:absolute;right:5px;top:3px;border:0;background:none;color:#fff9;font-size:24px;text-shadow:0 2px 2px #4b3b8e}.star.on{color:#ffec46}.footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:20px 0}.footer button{border:3px solid #fff;border-radius:20px;background:linear-gradient(#a17aff,#6845dc);box-shadow:0 5px #5543a4;color:#fff;font-weight:900;padding:12px 18px}.footer .danger{background:linear-gradient(#ff86bf,#ee238b)}.footer .vol{background:#ffffffc9;border-radius:18px;padding:11px;display:flex;align-items:center;gap:8px;font-weight:800}.footer .vol input{max-width:130px}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;background:#26245dbb;display:grid;place-items:center;padding:14px;z-index:10}.modal{background:#faf7ff;border:4px solid #fff;border-radius:28px;max-height:94vh;overflow:auto;width:min(100%,520px);padding:24px;box-shadow:0 18px 60px #201a4a88}.modal h2{margin:0 0 15px}.field{display:block;margin:12px 0;font-weight:800}.field input,.field select{display:block;width:100%;margin-top:6px;border:2px solid #c9c5f5;border-radius:13px;padding:11px;background:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.modal-actions button,.mini{border:0;border-radius:13px;padding:11px 14px;background:#6650dc;color:white;font-weight:800}.mini{background:#e0dcf8;color:#34316f}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatches button{width:34px;height:34px;border:2px solid white;border-radius:10px}.empty{text-align:center;padding:50px;color:#6a62aa}.hint{font-size:12px;color:#746aa0}.edit-only{display:none}.editing .edit-only{display:inline-flex}@media(max-width:900px){.grid{grid-template-columns:repeat(min(var(--cols),4),1fr)}.pad{border-radius:20px}.shell{padding:12px}}@media(max-width:560px){.grid{grid-template-columns:repeat(min(var(--cols),3),1fr);gap:10px}.board{padding:12px;border-radius:23px}.pad{border-radius:16px;border-width:3px;gap:3px}.pad .art{font-size:32px}.pad strong{font-size:11px}.logo{font-size:44px}.top-actions button{padding:9px;font-size:12px}.wave{height:28px}.tab{padding:9px 13px}.footer button{padding:10px}.star{font-size:18px}}
</style></head><body><div class="shell"><header class="mast"><div><div class="logo"><span class="so">SONO</span><span class="pop">POP</span> ♪</div><div class="by">BY BROT2YOU</div></div><div class="top-actions"><button id="favorites">⭐ Favoris</button><button id="settings">⚙️ Réglages</button></div></header><div class="wave"></div><nav class="tabs" id="tabs"></nav><main class="board"><div class="bar"><h2 id="heading">Tous les sons</h2><div class="tools"><label>Colonnes <select id="cols"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>8</option></select></label><label>Afficher <input id="limit" type="number" min="1" max="200" value="12"></label><button id="stop">■ Stop</button></div></div><section class="grid" id="grid"></section></main><div class="footer"><div style="display:flex;gap:9px;flex-wrap:wrap"><button id="add" class="edit-only">＋ Ajouter un son</button><button id="editMode">✎ Mode édition</button><button id="addCat" class="edit-only">＋ Catégorie</button><button id="export">⇩ Exporter</button><button id="import">⇧ Importer</button></div><div class="vol">🔊 <input id="volume" aria-label="Volume" type="range" min="0" max="100" value="80"><span id="volumeLabel">80%</span></div></div><p class="hint">Sauvegarde automatique sur cet appareil · Export JSON incluant images et sons · SONOPOP by BROT2YOU</p></div><input id="importFile" type="file" accept=".json" hidden><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),palette=[['#ff74c4','#e91685'],['#ffaf6c','#f34b29'],['#ffe666','#ff9a04'],['#9980ff','#5343dd'],['#d67eff','#8038d7'],['#6be9eb','#0096d2'],['#42d6ff','#1672f1'],['#fa849c','#e32954']];
const sample=['Cloche|🔔','Applaudissements|👏','Batterie|🥁','Public|🙌','Score !|⚡','Victoire|🏆','Vague|🌊','Vent|💨','Oiseau|🐦','Pluie|🌧️','Feu|🔥','Ville|🏙️'];
const initial=()=>({version:3,categories:[{id:uid(),name:'Tous les sons',pads:sample.map((s,i)=>({id:uid(),name:s.split('|')[0],emoji:s.split('|')[1],color:i%8,image:'',audio:'',favorite:false}))},{id:uid(),name:'Ambiances',pads:[]},{id:uid(),name:'Effets',pads:[]},{id:uid(),name:'Musique',pads:[]},{id:uid(),name:'Voix',pads:[]},{id:uid(),name:'Classe',pads:[]}],active:'all',editing:false,volume:80,columns:6,limit:12,mix:false});
let state=initial(),db,audios=new Map(),showFavorites=false,selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
function dbOpen(){return new Promise((ok,no)=>{let r=indexedDB.open('sonopop-v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function dbGet(){return new Promise((ok,no)=>{let r=db.transaction('data').objectStore('data').get('main');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function save(){if(!db)return;let r=db.transaction('data','readwrite').objectStore('data').put(state,'main');r.onerror=()=>alert('Stockage plein : exporte tes données et réduis la taille des MP3.')}
function cat(){return state.categories.find(c=>c.id===state.active)||state.categories[0]}
function allPads(){return state.categories.flatMap(c=>c.pads)}
function currentPads(){let a=state.active==='all'?allPads():cat().pads;return showFavorites?a.filter(p=>p.favorite):a}
function stop(){for(let [id,a] of audios){a.pause();a.currentTime=0}audios.clear();document.querySelectorAll('.pad.playing').forEach(e=>e.classList.remove('playing'))}
function play(p,el){if(!p.audio){alert('Ajoute un fichier audio à ce bouton en mode édition.');return}if(audios.has(p.id)){let a=audios.get(p.id);a.pause();a.currentTime=0;audios.delete(p.id);el.classList.remove('playing');return}if(!state.mix)stop();let a=new Audio(p.audio);a.volume=state.volume/100;audios.set(p.id,a);el.classList.add('playing');a.onended=()=>{audios.delete(p.id);el.classList.remove('playing')};a.play().catch(()=>{audios.delete(p.id);el.classList.remove('playing');alert('Lecture impossible : format non pris en charge.')})}
function render(){document.body.classList.toggle('editing',state.editing);$('#editMode').textContent=state.editing?'✓ Terminer l’édition':'✎ Mode édition';$('#tabs').innerHTML='<button class="tab '+(state.active==='all'&&!showFavorites?'active':'')+'" data-cat="all">▦ Tous les sons</button>'+state.categories.slice(1).map(c=>'<button class="tab '+(state.active===c.id&&!showFavorites?'active':'')+'" data-cat="'+c.id+'">'+esc(c.name)+'</button>').join('');$('#heading').textContent=showFavorites?'⭐ Favoris':state.active==='all'?'Tous les sons':cat().name;$('#cols').value=state.columns;$('#limit').value=state.limit;$('#volume').value=state.volume;$('#volumeLabel').textContent=state.volume+'%';let pads=currentPads().slice(0,state.limit);$('#grid').style.setProperty('--cols',state.columns);$('#grid').innerHTML=pads.length?pads.map(p=>{let c=palette[p.color]||palette[0];return '<button class="pad" data-pad="'+p.id+'" style="--c:'+c[0]+';--d:'+c[1]+'"><span class="art">'+(p.image?'<img alt="" src="'+esc(p.image)+'">':esc(p.emoji||'🔊'))+'</span><strong>'+esc(p.name)+'</strong><span class="star '+(p.favorite?'on':'')+'" data-star="'+p.id+'">★</span></button>'}).join(''):'<div class="empty">Aucun son ici. Passe en mode édition pour ajouter un bouton.</div>'}
$('#tabs').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;showFavorites=false;state.active=b.dataset.cat;render();save()};$('#grid').onclick=e=>{let star=e.target.closest('[data-star]');if(star){let p=allPads().find(p=>p.id===star.dataset.star);p.favorite=!p.favorite;save();render();return}let b=e.target.closest('[data-pad]');if(!b)return;let p=allPads().find(p=>p.id===b.dataset.pad);if(state.editing)editPad(p);else play(p,b)};$('#favorites').onclick=()=>{showFavorites=!showFavorites;render()};$('#stop').onclick=stop;$('#editMode').onclick=()=>{state.editing=!state.editing;save();render()};$('#cols').onchange=e=>{state.columns=+e.target.value;save();render()};$('#limit').onchange=e=>{state.limit=Math.max(1,Math.min(200,+e.target.value||12));save();render()};$('#volume').oninput=e=>{state.volume=+e.target.value;$('#volumeLabel').textContent=state.volume+'%';audios.forEach(a=>a.volume=state.volume/100);save()};
function modal(html){$('#modal').innerHTML='<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';$('#modal').onclick=e=>{if(e.target.classList.contains('modal-bg'))close()}}function close(){$('#modal').innerHTML=''}
function dataURL(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)})}
function editPad(p){let owner=state.categories.find(c=>c.pads.includes(p));let d=p?{...p}:{id:uid(),name:'',emoji:'🔊',color:0,image:'',audio:'',favorite:false};modal('<h2>'+(p?'Modifier':'Créer')+' un bouton</h2><label class="field">Nom<input id="pname" maxlength="60" value="'+esc(d.name)+'"></label><label class="field">Emoji<input id="pemoji" value="'+esc(d.emoji)+'"></label><label class="field">Catégorie<select id="pcat">'+state.categories.map(c=>'<option value="'+c.id+'" '+(c.id===(owner?.id||state.active)?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label><label class="field">Couleur<select id="pcolor">'+palette.map((c,i)=>'<option value="'+i+'" '+(d.color===i?'selected':'')+'>Couleur '+(i+1)+'</option>').join('')+'</select></label><label class="field">Illustration personnalisée<input id="pimage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="mini" id="clearImage">Retirer l’image</button><label class="field">Fichier audio (MP3, WAV, OGG, M4A)<input id="paudio" type="file" accept="audio/*"></label><button class="mini" id="clearAudio">Retirer le son</button><label class="field"><input id="pfav" type="checkbox" '+(d.favorite?'checked':'')+'> Favori</label><div class="modal-actions">'+(p?'<button class="mini" id="duplicate">Dupliquer</button><button class="mini" id="delete">Supprimer</button>':'')+'<button class="mini" id="cancel">Annuler</button><button id="commit">Enregistrer</button></div>');$('#cancel').onclick=close;$('#clearImage').onclick=()=>{d.image='';$('#pimage').value=''};$('#clearAudio').onclick=()=>{d.audio='';$('#paudio').value=''};$('#commit').onclick=async()=>{try{d.name=$('#pname').value.trim();d.emoji=$('#pemoji').value.trim()||'🔊';d.color=+$('#pcolor').value;d.favorite=$('#pfav').checked;if(!d.name)return alert('Saisis un nom');let f=$('#pimage').files[0],a=$('#paudio').files[0];if(f){if(!f.type.startsWith('image/'))throw Error('Image invalide');d.image=await dataURL(f)}if(a){if(!a.type.startsWith('audio/'))throw Error('Audio invalide');d.audio=await dataURL(a)}let target=state.categories.find(c=>c.id===$('#pcat').value);if(owner)owner.pads=owner.pads.filter(x=>x.id!==p.id);target.pads.push(d);state.active=target.id;showFavorites=false;stop();save();close();render()}catch(err){alert(err.message)}};if(p){$('#delete').onclick=()=>{if(!confirm('Supprimer ce bouton ?'))return;owner.pads=owner.pads.filter(x=>x.id!==p.id);stop();save();close();render()};$('#duplicate').onclick=()=>{owner.pads.push({...p,id:uid(),name:p.name+' (copie)'});save();close();render()}}}
$('#add').onclick=()=>editPad(null);
$('#addCat').onclick=()=>{modal('<h2>Nouvelle catégorie</h2><label class="field">Nom<input id="newcat" maxlength="45"></label><div class="modal-actions"><button class="mini" id="cancel">Annuler</button><button id="commit">Créer</button></div>');$('#cancel').onclick=close;$('#commit').onclick=()=>{let n=$('#newcat').value.trim();if(!n)return;let c={id:uid(),name:n,pads:[]};state.categories.push(c);state.active=c.id;showFavorites=false;save();close();render()}};
$('#settings').onclick=()=>{modal('<h2>⚙️ Réglages</h2><label class="field"><input id="mix" type="checkbox" '+(state.mix?'checked':'')+'> Autoriser plusieurs sons simultanés</label><p class="hint">Clique sur un bouton pour jouer son son. Clique à nouveau pour l’arrêter. En mode édition, clique pour personnaliser le bouton.</p><p class="hint">Les MP3 et images sont enregistrés localement. Exporte régulièrement ta sauvegarde JSON.</p><div class="modal-actions"><button id="commit">Enregistrer</button></div>');$('#commit').onclick=()=>{state.mix=$('#mix').checked;save();close()}};
$('#export').onclick=()=>{let b=new Blob([JSON.stringify({...state,editing:false})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='SONOPOP-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let s=JSON.parse(await f.text());if(s.version!==3||!Array.isArray(s.categories)||!s.categories.every(c=>typeof c.name==='string'&&Array.isArray(c.pads)&&c.pads.every(p=>typeof p.name==='string'&&(!p.audio||p.audio.startsWith('data:audio/'))&&(!p.image||p.image.startsWith('data:image/')))))throw Error('Fichier non reconnu');if(!confirm('Remplacer les données actuelles ?'))return;stop();state={...initial(),...s,editing:false};save();render()}catch(err){alert('Import impossible : '+err.message)}};
(async()=>{try{db=await dbOpen();let saved=await dbGet();if(saved?.version===3)state={...initial(),...saved,editing:false};else save()}catch(e){alert('Stockage local indisponible : '+e.message)}render()})();
</script></body></html>
